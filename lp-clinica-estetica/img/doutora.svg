<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="clinicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f5f2"/>
      <stop offset="100%" stop-color="#e9e1d8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#242220" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#clinicBg)"/>
  
  <!-- Linhas de fundo que remetem a consultório moderno -->
  <rect x="80" y="80" width="640" height="640" rx="20" fill="#ffffff" filter="url(#cardShadow)"/>
  <line x1="80" y1="240" x2="720" y2="240" stroke="#f1ede8" stroke-width="2"/>
  
  <!-- Ilustração da Especialista em Jaleco Médico Puro -->
  <g transform="translate(400, 440)">
    <!-- Jaleco Branco Estruturado -->
    <path d="M-190,260 L-130,50 L-60,40 L0,120 L60,40 L130,50 L190,260 Z" fill="#fdfbf9" stroke="#d5ccc2" stroke-width="2"/>
    <path d="M-60,40 L-40,160 L0,180 L40,160 L60,40" fill="#ffffff" stroke="#9c6644" stroke-width="2"/>
    <!-- Gola do Jaleco Elegante -->
    <path d="M-60,40 L-10,130 L-5,70 Z" fill="#f4ece4" stroke="#9c6644" stroke-width="1.5"/>
    <path d="M60,40 L10,130 L5,70 Z" fill="#f4ece4" stroke="#9c6644" stroke-width="1.5"/>
    
    <!-- Cabeça e Penteado Alinhado -->
    <circle cx="0" cy="-60" r="70" fill="#ebdcd0"/>
    <path d="M-75,-60 C-75,-145 75,-145 75,-60 C65,-120 -65,-120 -75,-60 Z" fill="#4a3728"/>
    <path d="M-75,-40 C-65,-10 65,-10 75,-40" fill="#4a3728"/>

    <!-- Prancheta / Ficha Clínica de Avaliação -->
    <rect x="-80" y="110" width="160" height="110" rx="8" fill="#ffffff" stroke="#b88a68" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="-60" y="100" width="120" height="16" rx="4" fill="#9c6644"/>
    <line x1="-50" y1="140" x2="50" y2="140" stroke="#e0d7ce" stroke-width="3" stroke-linecap="round"/>
    <line x1="-50" y1="160" x2="30" y2="160" stroke="#e0d7ce" stroke-width="3" stroke-linecap="round"/>
    <line x1="-50" y1="180" x2="40" y2="180" stroke="#e0d7ce" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Tarja de Credenciamento no rodapé da imagem -->
  <rect x="180" y="660" width="440" height="46" rx="23" fill="#1a1918"/>
  <text x="400" y="688" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="1">AVALIAÇÃO ANATÔMICA INDIVIDUALIZADA</text>
</svg>
